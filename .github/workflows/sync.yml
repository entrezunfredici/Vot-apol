name: Sync quotidien

# Chaîne : téléchargement (ALG-13) -> import -> noms (ALG-09) -> export (ALG-11) -> vérification
# indépendante (ALG-14) -> décision (ALG-12). Le déploiement est un travail distinct qui ne publie
# que l'artefact examiné par la décision. Voir docs/deployment.md.
#
# Réglages à créer dans GitHub (Settings) avant la première exécution :
#   Variable  VOTEAPOL_URL_PUBLIEE  racine en ligne des données, ex. https://voteapol.<compte>.workers.dev/data/v1/
#             (vide ou absente : aucune comparaison avec une version publiée ; première publication)
#   Secrets   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Environnements  `publication` (sans relecteur) et `validation-publication` (UN relecteur : le responsable)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      forcer:
        description: "Republier même si toutes les entrées sont identiques (V08 : attend la validation)"
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
    env:
      VOTEAPOL_URL_PUBLIEE: ${{ vars.VOTEAPOL_URL_PUBLIEE }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }

      # G05 : tests, lexique contrôlé, couleurs. Un échec n'arrête pas la chaîne : il est consigné
      # dans la décision (règle G05), qui bloque alors la publication.
      - name: Tests
        id: tests
        run: |
          if (cd etl && uv sync --quiet && uv run pytest -q) && (cd web && npm ci && npm test); then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync (ALG-13, 01, 07, 05, 09, 11, 14, 12)
        working-directory: etl
        run: |
          args=(--workdir ../travail --out ../dist-data/data/v1)
          if [ "${{ steps.tests.outputs.ok }}" = "true" ]; then args+=(--tests-ok); fi
          if [ "${{ inputs.forcer }}" = "true" ]; then args+=(--forcer); fi
          uv run python -m etl sync "${args[@]}"

      - name: Décision
        id: decision
        if: always()
        run: |
          if [ -f travail/decision.json ]; then
            echo "decision=$(jq -r .decision travail/decision.json)" >> "$GITHUB_OUTPUT"
          else
            echo "decision=aucune" >> "$GITHUB_OUTPUT"
          fi

      # Conservés 30 jours (ALG-12 : conservation des artefacts de déploiement ; ALG-13 : archives)
      - name: Artefact de décision (journaux, décision, vérification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision
          path: |
            travail/decision.json
            travail/verification.json
            travail/journaux/
            travail/archives/provenance.json
            travail/referentiels/provenance.json
          retention-days: 30
          if-no-files-found: warn
      - name: Archives sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archives
          path: |
            travail/archives/*.zip
            travail/referentiels/*.zip
          retention-days: 30
          if-no-files-found: ignore
      - name: Artefact de données (à déployer tel quel)
        if: steps.decision.outputs.decision == 'publier' || steps.decision.outputs.decision == 'attente_validation'
        uses: actions/upload-artifact@v4
        with:
          name: donnees
          path: |
            dist-data/data/v1
            travail/decision.json
          retention-days: 30
          if-no-files-found: error

  # `publier` : déploiement direct. `attente_validation` : l'environnement exige l'approbation du
  # relecteur, sur l'artefact de CETTE exécution (une nouvelle exécution demande une nouvelle
  # approbation). `bloquer` et `rien_a_faire` : ce travail ne s'exécute pas (le premier fait aussi
  # échouer `sync`).
  deploy:
    needs: sync
    if: needs.sync.outputs.decision == 'publier' || needs.sync.outputs.decision == 'attente_validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.sync.outputs.decision == 'attente_validation' && 'validation-publication' || 'publication' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/download-artifact@v4
        with:
          name: donnees
          path: artefact

      # ALG-12.8 : ne déployer que ce que la décision a examiné (décision et fichiers intacts)
      - name: Autorisation
        working-directory: etl
        run: |
          args=(--decision ../artefact/travail/decision.json --data ../artefact/dist-data/data/v1)
          # Ce travail ne démarre qu'après l'approbation de l'environnement `validation-publication`.
          if [ "${{ needs.sync.outputs.decision }}" = "attente_validation" ]; then args+=(--approuvee); fi
          uv sync --quiet
          uv run python -m etl autoriser "${args[@]}"

      - name: Build du site
        working-directory: web
        run: |
          npm ci
          npm run build
          mkdir -p dist/data
          cp -r ../artefact/dist-data/data/v1 dist/data/v1

      - name: Limites Cloudflare (< 20 000 fichiers, < 25 Mo par fichier)
        run: python scripts/check_deploy_limits.py web/dist

      - name: Déploiement
        working-directory: web
        run: npx --yes wrangler@4 deploy

      # ALG-12.9 : on ne suppose pas que le déploiement a réussi
      - name: Confirmation en ligne
        working-directory: etl
        run: uv run python -m etl verifier-deploiement --url-publiee "${{ vars.VOTEAPOL_URL_PUBLIEE }}" --data ../artefact/dist-data/data/v1
